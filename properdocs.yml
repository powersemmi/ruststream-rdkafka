site_name: ruststream-rdkafka
site_description: The Apache Kafka broker for RustStream - consumer groups, precise tracked commits, native record keys, and an in-process test broker.
site_url: https://powersemmi.github.io/ruststream-rdkafka/
repo_url: https://github.com/powersemmi/ruststream-rdkafka
repo_name: powersemmi/ruststream-rdkafka
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # The default slugifier drops every non-ASCII character, so a Russian or Chinese heading
      # gets an empty id and the table of contents links to nothing. This one keeps the script
      # and leaves ASCII headings with exactly the ids they already have.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - docs/hooks/snippet_titles.py
  - docs/hooks/i18n_banner.py

plugins:
  - search
  # Versioned docs are published with mike (see .github/workflows/docs-deploy.yml).
  # Translations live under `docs/<locale>/`, mirroring the English paths; English stays at the
  # docs root. Keep `fallback_to_default`: it is what lets translations land page by page.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Russian
          build: true
          nav_translations:
            Home: Главная
            Guide: Руководство
            RustStream docs: Документация RustStream
            API reference: Справочник API
        - locale: zh
          name: Chinese
          build: true
          nav_translations:
            Home: 首页
            Guide: 指南
            RustStream docs: RustStream 文档
            API reference: API 参考

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/powersemmi/ruststream-rdkafka

nav:
  - Home: index.md
  - Guide:
      - topics.md
      - publishing.md
      - schema-registry.md
      - testing.md
  - RustStream docs: https://powersemmi.github.io/ruststream/
  - API reference: https://docs.rs/ruststream-rdkafka
