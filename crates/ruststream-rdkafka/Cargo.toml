[package]
name = "ruststream-rdkafka"
description = "Apache Kafka broker implementation for the RustStream messaging framework, backed by rdkafka / librdkafka."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["kafka", "messaging", "broker", "streaming", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = ["json"]
# Codec forwarders, mirroring the core's feature names: `json` (the default) makes the core's
# DefaultCodec available, which is what a mount site with no `.codec(..)` step encodes with.
json = ["ruststream/json"]
msgpack = ["ruststream/msgpack"]
cbor = ["ruststream/cbor"]
# Confluent Schema Registry: the client, the wire-format envelope, and the subscriber-side
# schema prefetch that keeps the sync codec path free of I/O.
schema-registry = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:schemars"]
# Avro transcoding for the registry middleware: apache-avro's serde path plus the AvroSchema
# derive for registering subjects from types.
avro = ["schema-registry", "dep:apache-avro"]
# Protobuf: the byte-lane surface over prost-generated messages, plus the transcoding path for
# the registry middleware - dynamic messages (prost-reflect) with descriptors compiled from the
# registry's .proto sources (protox).
protobuf = ["schema-registry", "dep:prost", "dep:prost-reflect", "dep:protox"]
# Ships the in-process test broker (`testing` module). The conformance harness is broker-author
# tooling and stays in this repo's dev-dependencies, out of the user-facing feature.
testing = ["ruststream/testing"]
# TLS and compression backends, mapped 1:1 onto rdkafka's cargo features. Only the backends
# that build hermetically everywhere are surfaced here (SASL PLAIN/SCRAM/OAUTHBEARER need no
# feature at all - librdkafka implements them built-in); anything else (gssapi, cmake-build,
# dynamic-linking, ...) can be enabled by depending on `rdkafka` directly, since cargo features
# are additive across the dependency graph.
ssl = ["rdkafka/ssl"]
ssl-vendored = ["rdkafka/ssl-vendored"]
zstd = ["rdkafka/zstd"]

[dependencies]
ruststream = { workspace = true }
rdkafka = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
apache-avro = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
protox = { workspace = true, optional = true }

[dev-dependencies]
ruststream = { workspace = true, features = ["conformance", "testing", "macros", "json"] }
serde = { workspace = true }
tokio = { workspace = true }
wiremock = "0.6"

# The vendored librdkafka build makes docs.rs shy away from the TLS/SASL backends; the API
# surface is identical either way, so document with just the `testing` module enabled.
[package.metadata.docs.rs]
features = ["testing"]

# The kafka_* examples are the docs-site snippet sources; keep them runnable and snippet-checked.
[[example]]
name = "kafka_quickstart"

[[example]]
name = "kafka_topics"

[[example]]
name = "kafka_keys"

[[example]]
name = "kafka_producer"

[[example]]
name = "kafka_distribution"

[[example]]
name = "kafka_multi_topic"

[[example]]
name = "kafka_batches"

[[example]]
name = "kafka_retries"

[[example]]
name = "kafka_seek"

[[example]]
name = "kafka_transactions"

[[example]]
name = "kafka_schema_registry"
required-features = ["schema-registry"]

[[example]]
name = "kafka_avro"
required-features = ["avro"]

[[example]]
name = "kafka_protobuf"
required-features = ["protobuf"]

[[example]]
name = "kafka_testing"
required-features = ["testing"]
