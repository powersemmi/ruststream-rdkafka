[package]
name = "ruststream-rdkafka"
description = "Apache Kafka broker implementation for the RustStream messaging framework, backed by rdkafka / librdkafka."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["kafka", "messaging", "broker", "streaming", "ruststream"]
categories = ["asynchronous", "network-programming"]
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false

[lints]
workspace = true

[features]
default = ["json"]
# Codec forwarders, mirroring the core's feature names: `json` (the default) makes the core's
# DefaultCodec available, which is what a mount site with no `.codec(..)` step encodes with.
json = ["ruststream/json"]
msgpack = ["ruststream/msgpack"]
cbor = ["ruststream/cbor"]
# Confluent Schema Registry: the client, the wire-format envelope, and the subscriber-side
# schema prefetch that keeps the sync codec path free of I/O.
schema-registry = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:schemars"]
# Avro transcoding for the registry middleware: apache-avro's serde path plus the AvroSchema
# derive for registering subjects from types.
avro = ["schema-registry", "dep:apache-avro"]
# Protobuf: the byte-lane surface over prost-generated messages, plus the transcoding path for
# the registry middleware - dynamic messages (prost-reflect) with descriptors compiled from the
# registry's .proto sources (protox).
protobuf = ["schema-registry", "dep:prost", "dep:prost-reflect", "dep:protox"]
# The protocol bindings this crate contributes to the generated AsyncAPI document: the Kafka
# topic behind a channel, the consumer group of an operation, the schema-registry coordinate of
# a server. Forwarded from the core, where the document is built.
asyncapi = ["ruststream/asyncapi", "dep:serde"]
# The in-process mode `TestApp::start` connects the production broker through: an in-process
# Kafka cluster (topics, partitions, consumer groups, offsets, transactions). The conformance
# harness is broker-author tooling and stays in this repo's dev-dependencies, out of the
# user-facing feature.
testing = ["ruststream/testing", "dep:regex"]
# TLS and compression backends, mapped 1:1 onto rdkafka's cargo features. Only the backends
# that build hermetically everywhere are surfaced here (SASL PLAIN is built in; SCRAM and
# OAUTHBEARER come with either TLS feature); anything else (gssapi, cmake-build,
# dynamic-linking, ...) can be enabled by depending on `rdkafka` directly, since cargo features
# are additive across the dependency graph.
ssl = ["rdkafka/ssl"]
ssl-vendored = ["rdkafka/ssl-vendored"]
zstd = ["rdkafka/zstd"]

[dependencies]
ruststream = { workspace = true }
rdkafka = { workspace = true }
bytes = { workspace = true }
yoke = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
apache-avro = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
protox = { workspace = true, optional = true }
regex = { workspace = true, optional = true }

[dev-dependencies]
ruststream = { workspace = true, features = [
    "asyncapi",
    "conformance",
    "testing",
    "macros",
    "json",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Builds the examples' tests into one test binary (`tests/examples.rs`) instead of a test binary
# per example. It lives in the core repository and is not published: a dev-dependency without a
# version is dropped on publish.
ruststream-example-suite = { git = "https://github.com/powersemmi/ruststream", branch = "main" }
wiremock = "0.6"
schema_registry_converter = { version = "6", default-features = false, features = ["avro", "rustls_tls", "futures"] }

# The publish cost test compares a publish with the raw client's, librdkafka's allocations
# included: jemalloc replaces the C allocator in that test binary and counts per thread.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
tikv-jemalloc-sys = { version = "0.7.1", features = ["override_allocator_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }

# The crate overview links into the feature-gated modules (`schema_registry`, `avro`,
# `protobuf`, `testing`, the document), so a page built on the default features would have
# nowhere to send a reader. The list stops short of the TLS/SASL backends: the vendored
# librdkafka build is what docs.rs shies away from, and the API surface is identical either way.
[package.metadata.docs.rs]
features = ["testing", "schema-registry", "avro", "protobuf", "asyncapi"]

# The examples are the sources of the documentation site's code blocks: each one compiles, and
# the ones a page shows carry the tests that prove what the page says.

