[package]
name = "ruststream-rdkafka-schema-macros"
description = "The Schema derive of ruststream-rdkafka: checks a message type against the schema migrations of its subjects when the crate compiles. Use it through ruststream-rdkafka's `schema-check` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
authors.workspace = true
keywords = ["kafka", "schema-registry", "avro", "ruststream", "derive"]
categories = ["development-tools::procedural-macro-helpers", "encoding"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
# The parser serde's own derive reads serde attributes with, on the syntax tree of this crate.
serde_derive_internals = "0.29"
# The same parser at the version `schemars` uses, for the JSON check: it reads serde attributes
# exactly as the schema export does. It works on a syntax tree of its own.
serde_derive_internals_json = { package = "serde_derive_internals", version = "0.30" }
syn3 = { package = "syn", version = "3", default-features = false, features = ["derive", "parsing", "printing", "clone-impls"] }
# The online drift guard's HTTP client: it runs only inside the compiler, on the build host.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
base64 = "0.22"
percent-encoding = "2"

[dev-dependencies]
# The compile-fail and pass cases build against the crate that holds the traits the derive's
# assertions name, as a service does. The bound is the release the pinned messages were written
# with: the early 1.0 releases no longer build against their own dependencies.
trybuild = "1.0.122"
ruststream-rdkafka = { workspace = true, features = ["schema-check", "schema-registry", "avro", "uuid", "chrono"] }
ruststream = { workspace = true, features = ["macros", "json"] }
apache-avro = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["uuid1", "chrono04"] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
