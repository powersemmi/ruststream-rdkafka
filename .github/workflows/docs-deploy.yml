name: Deploy docs

on:
  push:
    branches: [main]
    # Narrower than docs.yml on purpose: deploy only when the published content changes,
    # not on every example/code merge.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: mike deploy
    runs-on: ubuntu-latest
    steps:
      # Keeps credentials on purpose: mike pushes the built site to gh-pages.
      - uses: actions/checkout@v4 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        run: |
          version="$(sed -nE 's/^version = "([0-9]+)\.([0-9]+).*/\1.\2/p' Cargo.toml | head -1)"
          mike deploy --push --update-aliases "$version" latest
          mike set-default --push latest
