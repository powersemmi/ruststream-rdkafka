name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches the Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VER="${TAG#v}"
          CARGO_VER="$(python3 - <<'EOF'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["workspace"]["package"]["version"])
          EOF
          )"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "Tag $TAG does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi

  crates-io:
    name: Publish ruststream-rdkafka to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Trusted publishing: the token comes from the crates.io OIDC exchange,
      # not from a stored secret.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          name=ruststream-rdkafka
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
          index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
          if curl -fsSL "$index" 2>/dev/null | grep -qF "\"vers\":\"${version}\""; then
            echo "$name $version already on crates.io, skipping"
          else
            cargo publish -p "$name"
          fi
