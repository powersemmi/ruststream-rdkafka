[workspace]
resolver = "3"
members = [
    "crates/ruststream-rdkafka",
    "crates/ruststream-rdkafka-bench",
    "crates/ruststream-rdkafka-schema-macros",
    "crates/ruststream-rdkafka-schema-cli",
]
# cargo-generate scaffolds: their sources carry `{{project-name}}` placeholders that are not valid
# Rust/TOML until rendered, so they stay out of the workspace. `exclude` alone is not enough:
# cargo's git-source package discovery ignores it and parses every `Cargo.toml` in the repository,
# which is why the scaffold manifest is named `Cargo.toml.liquid` (cargo-generate drops the suffix
# when it renders it).
exclude = ["templates"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-rdkafka"
homepage = "https://powersemmi.github.io/ruststream-rdkafka/latest/"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-rdkafka = { path = "crates/ruststream-rdkafka", version = "0.7.1" }
ruststream-rdkafka-schema-macros = { path = "crates/ruststream-rdkafka-schema-macros", version = "0.7.1" }

ruststream = { version = "0.7.6", default-features = false }

# The `tracing` feature routes librdkafka's own log lines through `tracing` instead of `log`.
rdkafka = { version = "0.39", features = ["tokio", "tracing"] }
bytes = "1"
# The cart a delivery carries its record on (see `record`).
yoke = { version = "0.8", features = ["derive"] }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
# The Schema Registry client: rustls only (no openssl in the dependency tree by default).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
apache-avro = { version = "0.22", features = ["derive"] }
# Named explicitly, not taken through prost-reflect's re-export: the byte-lane surface bounds on
# `prost::Message`, and a generated type only satisfies that bound if it was built against this
# very version - so the version a service must match belongs in the manifest, not in a re-export.
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
# `subject.toml` of the migrations directory, read by the derive, the build-script check and the
# migrations tool.
toml = "0.9"
# The in-process cluster's pattern subscriptions, behind the `testing` feature.
regex = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

# What ships is optimized across crate boundaries: the framework is generic to the point where a
# dispatch path is only as cheap as the inlining it gets, and a build that stops at each crate
# boundary is not the one to publish numbers from.
[profile.release]
lto = "fat"

# The benchmarks measure what ships, so they are built the way a release is: the profile inherits
# it whole, and the only addition is the line tables a profile needs to name functions. Debug
# information is metadata and changes no codegen decision.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
